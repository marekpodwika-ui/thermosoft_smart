name: Build iOS

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Install MAUI workload
        run: dotnet workload install maui-ios

      - name: Accept iOS SDK licenses
        run: |
          sudo xcodebuild -license accept || true
          sudo xcodebuild -runFirstLaunch || true

      - name: List available SDKs
        run: |
          echo "=== Xcode version ==="
          xcodebuild -version
          echo "=== iOS SDKs ==="
          xcodebuild -showsdks
          echo "=== .NET info ==="
          dotnet --info

      - name: Build iOS app for simulator (skip signing)
        id: build
        continue-on-error: true
        run: |
          dotnet build thermosoft/thermosoft.csproj \
            -f net9.0-ios \
            -c Debug \
            -p:RuntimeIdentifier=iossimulator-arm64 \
            -p:CreatePackage=false \
            -p:ArchiveOnBuild=false \
            -p:EnableCodeSigning=false \
            -p:CodesignKey="" \
            -p:CodesignProvision="" \
            -p:ProvisioningType="" \
            -bl:build.binlog \
            --verbosity detailed 2>&1 | tee build.log

      - name: Show build errors
        if: steps.build.outcome == 'failure'
        run: |
          echo "=== BUILD FAILED ==="
          grep -i "error\|failed\|exception" build.log | tail -50 || cat build.log | tail -100

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-binlog
          path: build.binlog
          retention-days: 1

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-output
          path: |
            thermosoft/bin/
            thermosoft/obj/
          retention-days: 1
