name: Build iOS

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Install MAUI workload
        run: dotnet workload install maui-ios

      - name: List available SDKs
        run: |
          echo "=== Xcode version ==="
          xcodebuild -version
          echo "=== iOS SDKs ==="
          xcodebuild -showsdks
          echo "=== .NET info ==="
          dotnet --info

      - name: Build iOS app for simulator (skip signing)
        run: |
          dotnet build thermosoft/thermosoft.csproj \
            -f net9.0-ios \
            -c Debug \
            -p:RuntimeIdentifier=iossimulator-arm64 \
            -p:CreatePackage=false \
            -p:ArchiveOnBuild=false \
            -p:EnableCodeSigning=false \
            -p:CodesignKey="" \
            -p:CodesignProvision="" \
            -p:ProvisioningType="" \
            --verbosity detailed

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-output
          path: |
            thermosoft/bin/
            thermosoft/obj/
          retention-days: 1
