name: Build iOS

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Install MAUI workload
        run: dotnet workload install maui-ios

      - name: Build iOS app (with implicit restore)
        run: |
          dotnet build thermosoft/thermosoft.csproj \
            -f net9.0-ios \
            -c Release

      - name: Upload artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: thermosoft/bin/Release/net9.0-ios/
          retention-days: 7
